[pytest]
log_cli = true
log_cli_level = INFO
log_format = %(message)s
markers =
    regression: регрессионные тесты
    api: API-тесты
    db: тесты БД
    integration: интеграционные тесты
    auth: тесты авторизации
    user: тесты пользователей
    movie: тесты фильмов
    filters: тесты фильтров
    negative: тесты с негативным исходом